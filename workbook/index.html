<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnify Impact — Workbook</title>
<meta name="robots" content="noindex">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f8f5f0; color: #222;
  }
  #frame { display: block; width: 100%; height: 100%; border: 0; }
  #msg {
    display: flex; align-items: center; justify-content: center; height: 100%;
    text-align: center; padding: 2em; box-sizing: border-box;
  }
  #msg p { font-size: 1.1em; line-height: 1.5; max-width: 28em; }
</style>
</head>
<body>
<div id="msg" hidden><p id="msgText">Opening your workbook&hellip;</p></div>
<iframe id="frame" title="Magnify Impact workbook" hidden
        allow="clipboard-write"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
<noscript>
  <p style="padding:2em">Please enable JavaScript, or ask your facilitator for the direct
  link they shared.</p>
</noscript>
<script>
  // Friendly, memorable URL for the QR code / spoken URL on the AI-orientation slides
  // (Training Materials/ai-orientation-1hr-deck/). Its job is to carry "?s=SESSIONCODE"
  // through to the Apps Script workbook.
  //
  // THIS EMBEDS RATHER THAN REDIRECTS, and that is load-bearing -- do not "simplify" it
  // back into a window.location.replace(). Verified on a real 2-account Chrome profile
  // 2026-09-08: a TOP-LEVEL navigation to /macros/s/.../exec is rewritten by Google to
  // /macros/u/1/s/.../exec and fails with Drive's "Sorry, unable to open the file at
  // this time." The identical URL loaded in an IFRAME resolves to the anonymous sandbox
  // path with no account index and works. That failure is what forced attendees to open
  // the workbook in an incognito window; embedding is what removed that instruction.
  // Also verified: google.script.run still works cross-origin, including with
  // third-party cookies blocked (the Safari/Firefox default).
  //
  // The workbook sets XFrameOptionsMode.ALLOWALL to permit this, and carries a matching
  // ancestor-origin guard in Index.html. If this page ever moves off magnifyimpact.ai,
  // that allowlist must be updated too or the workbook will refuse to render here.
  //
  // GitHub Pages redirects "/workbook" -> "/workbook/" with a 301 that PRESERVES the
  // query string, so both forms reach this page with the code intact.
  //
  // Keep WORKBOOK_EXEC_URL in sync with the same constant in
  // .claude/skills/workshop-session/scripts/session_manager.py.
  var WORKBOOK_EXEC_URL = "https://script.google.com/macros/s/AKfycbwhysB9l2Z-XghP0AEyFBIKMzG7yjjHGIdUVzUfGYplxJY6dvOlLLKBOGgAJvOd3411Eg/exec";

  var code = new URLSearchParams(window.location.search).get('s');
  var frame = document.getElementById('frame');
  var msg = document.getElementById('msg');

  if (code) {
    frame.src = WORKBOOK_EXEC_URL + '?s=' + encodeURIComponent(code);
    frame.hidden = false;
  } else {
    document.getElementById('msgText').textContent =
      "This link is missing a session code. Ask your facilitator for today's QR code or link.";
    msg.hidden = false;
  }
</script>
</body>
</html>
